---
- name: Automate Nginx Deployment on AWS EC2
  hosts: webservers
  become: true

  tasks:
    - name: Update installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy custom HTML page
      ansible.builtin.copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Verify Nginx is responding
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
